    <text x="66" y="398" font-size="23">hey! i'm INNNX — I like turning random ideas into real things.</text>
    <text x="66" y="449" font-size="20" fill="#9198a1" letter-spacing="1">✳ code   ✳ games   ✳ robots   ✳ security</text>
