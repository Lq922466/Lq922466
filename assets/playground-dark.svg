<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">innnx's playground ✳ — INNNX.</title>
  <desc id="desc">A muted gray-purple playground. Making Stuff Just Because. Code, games, robots and security. Four cards: Featured, Infra &amp; Security, Games, and Robots &amp; IoT. Currently experimenting with everything.</desc>
  <style>
    .card-border { animation: border-breathe 5s ease-in-out infinite; }
    .card-1 .card-border { animation-delay: -1.25s; }
    .card-2 .card-border { animation-delay: -2.5s; }
    .card-3 .card-border { animation-delay: -3.75s; }
    @keyframes border-breathe { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .card-border { animation: none; } }
  </style>
  <defs>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".7" fill="#9198a1" opacity=".12"/><circle cx="17" cy="18" r=".6" fill="#9198a1" opacity=".1"/></pattern>
    <g id="star" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M-12 0H12M0-12V12M-8.5-8.5L8.5 8.5M-8.5 8.5L8.5-8.5"/></g>
  </defs>
