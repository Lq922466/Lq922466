  <title id="title">innnx's playground ✳ — INNNX.</title>
  <desc id="desc">A muted gray-purple playground. Making Stuff Just Because. Code, games, robots and security. Four cards: Featured, Infra &amp; Security, Games, and Robots &amp; IoT. Currently experimenting with everything.</desc>
